<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMP-Face</title>
    <style>
        :root {
            --nav-bg: rgba(7, 16, 28, 0.94);
            --nav-line: rgba(148, 189, 220, 0.22);
            --nav-ink: #e9f2fb;
            --nav-muted: rgba(233, 242, 251, 0.7);
            --nav-accent: #2b6f9f;
            --nav-accent-2: #7db3d6;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #0a1422;
            color: var(--nav-ink);
        }

        .top-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--nav-bg);
            border-bottom: 1px solid var(--nav-line);
            backdrop-filter: blur(16px);
        }

        .nav-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            position: relative;
        }

        .nav-link,
        .nav-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid transparent;
            color: var(--nav-ink);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.25s ease;
        }

        .nav-link:hover,
        .nav-button:hover {
            background: rgba(43, 111, 159, 0.2);
            border-color: rgba(43, 111, 159, 0.45);
        }

        .nav-button {
            background: linear-gradient(135deg, rgba(43, 111, 159, 0.95), rgba(9, 21, 37, 0.98));
            border-color: rgba(43, 111, 159, 0.5);
            color: #f7fbfb;
        }

        .nav-button:hover {
            background: linear-gradient(135deg, rgba(57, 135, 186, 1), rgba(9, 21, 37, 1));
        }

        .nav-icon {
            width: 18px;
            height: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .nav-icon svg {
            stroke: var(--nav-accent-2);
        }

        .nav-link:hover .nav-icon svg {
            stroke: var(--nav-accent);
        }

        .nav-button .nav-icon svg {
            stroke: #f7fbfb;
        }

        .nav-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--nav-ink);
            text-decoration: none;
            font-weight: 700;
            letter-spacing: 0.6px;
        }

        .nav-logo img {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid rgba(125, 179, 214, 0.6);
            box-shadow: 0 0 10px rgba(125, 179, 214, 0.45);
        }

        .nav-logo span {
            color: var(--nav-accent-2);
        }

        .nav-center {
            display: flex;
            justify-content: center;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .nav-search {
            min-width: 240px;
            justify-content: center;
        }

        .nav-right {
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .nav-label {
            font-weight: 600;
            color: var(--nav-ink);
        }

        @media (max-width: 768px) {
            .nav-inner {
                flex-wrap: wrap;
                justify-content: center;
            }

            .nav-logo {
                margin-right: 0;
            }

            .nav-center {
                order: 2;
                width: 100%;
                justify-content: center;
                position: static;
                transform: none;
            }

            .nav-right {
                order: 3;
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body id="welcomePage">
    <nav class="top-nav">
        <div class="nav-inner">
            <a class="nav-logo" href="{% url 'welcome' %}">
                <img alt="MonFace logo" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'><defs><linearGradient id='g' x1='0' x2='1' y1='0' y2='1'><stop offset='0' stop-color='%232b6f9f'/><stop offset='1' stop-color='%23091325'/></linearGradient></defs><rect width='80' height='80' rx='24' fill='url(%23g)'/><circle cx='40' cy='34' r='14' fill='%23f7fbfb'/><path d='M18 66c6-12 38-12 44 0' fill='%237db3d6'/></svg>">
                <span>UMP Face</span>
            </a>
            <div class="nav-center">
                <a class="nav-button nav-search" href="{% url 'search_users' %}" aria-label="Rechercher un ami">
                    <span class="nav-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="7"></circle>
                            <path d="M20 20l-4-4"></path>
                        </svg>
                    </span>
                    <span class="nav-label">Rechercher un ami</span>
                </a>
            </div>
            <div class="nav-right">
                <a class="nav-link" href="{% url 'welcome' %}" aria-label="Accueil">
                    <span class="nav-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 10.5L12 3l9 7.5"></path>
                            <path d="M5 10v10h14V10"></path>
                        </svg>
                    </span>
                </a>
                {% if logged_user %}
                    <a class="nav-link" href="{% url 'view_profile' logged_user.id %}" aria-label="Mon profil">
                        <span class="nav-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="8" r="4"></circle>
                                <path d="M4 20c2.5-4 13.5-4 16 0"></path>
                            </svg>
                        </span>
                    </a>
                    <a class="nav-link" href="{% url 'edit_profile' %}" aria-label="Modifier profil">
                        <span class="nav-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 20h9"></path>
                                <path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4Z"></path>
                            </svg>
                        </span>
                    </a>
                    <a class="nav-button" href="{% url 'logout' %}" aria-label="Deconnexion">
                        <span class="nav-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 3h6a2 2 0 0 1 2 2v4"></path>
                                <path d="M9 21h6a2 2 0 0 0 2-2v-4"></path>
                                <path d="M4 12h12"></path>
                                <path d="M9 8l-4 4 4 4"></path>
                            </svg>
                        </span>
                        <span class="nav-label">{{ logged_user.prenom }}</span>
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    {% block contenu %}{% endblock %}
</body>
</html>
